name: Security Guard Shield

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  malware-guard:
    name: Scan for Stealth Malware & Injected Payloads
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Malware Guard Scan
        run: node scripts/guard.cjs
