name: HMS Frontend Deployment

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # =========================================
      # 🧪 DEVELOP → VPS (TEST)
      # =========================================
      - name: Deploy Frontend to VPS (Test)
        if: github.ref == 'refs/heads/develop'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🚀 Starting TEST deployment..."

            cd /root/HMS.Frontend-Test

            git fetch https://${{ secrets.GH_TOKEN }}@github.com/ClassicalAitem/HMS.Frontend.git develop
            git reset --hard FETCH_HEAD

            rm -rf .env
            cp ../.env.test .env

            npm install
            npm run build 2>&1 | tee /tmp/hms-test-build.log || (echo "❌ Build failed:" && cat /tmp/hms-test-build.log && exit 1)

            rm -rf /var/www/hms-frontend-test/*
            cp -r dist/* /var/www/hms-frontend-test/

            chown -R www-data:www-data /var/www/hms-frontend-test
            chmod -R 755 /var/www/hms-frontend-test

            systemctl reload nginx

            echo "✅ TEST deployed successfully"

      # =========================================
      # 🖥️ MAIN → VPS (PROD)
      # =========================================
      - name: Deploy Frontend to VPS (Prod)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🚀 Starting PROD deployment..."

            cd /root/HMS.Frontend

            git fetch https://${{ secrets.GH_TOKEN }}@github.com/ClassicalAitem/HMS.Frontend.git main
            git reset --hard FETCH_HEAD

            rm -rf .env
            cp ../.env .env

            npm install
            npm run build 2>&1 | tee /tmp/hms-build.log || (echo "❌ Build failed:" && cat /tmp/hms-build.log && exit 1)

            rm -rf /var/www/hms-frontend/*
            cp -r dist/* /var/www/hms-frontend/

            chown -R www-data:www-data /var/www/hms-frontend
            chmod -R 755 /var/www/hms-frontend

            systemctl reload nginx

            echo "✅ PROD deployed successfully"